<html>
<head><title>Student Registration Form</title>
<style>
	body{ 
		font-family: sans-serif;
		background-color: #f0f4f8;
		padding:40px;
		margin:0;
		}
	h1{
		color: #1a202c;
		font-size: 1.6rem;
		margin-bottom: 24px;
		}
</style>
</head>
<body>
	<h1><center>Student Registration Form</center></h1>
	<form action="" method="post">
	<label>Full Name :</label>
	<input type="text" name="FNAME" placeholder="Enter your full name"></input><br><br>
	
	
	<label>Email Address :</label>
	<input type="Email" name="mail" placeholder="you@university.edu" ></input><br><br>
	
	<label>Password :</label>
	<input type="Password" name="pass" placeholder="Minumum 8 Characters"></input><br><br>
	
	<label>Age :</label>
	<input type="number" name="no" placeholder="Your Age" ></input><br><br>
	
	<label>Phone Number :</label>
	<input type="tel" name="tp" placeholder="+94 77 000 0000"></input><br><br>
	
	<p>Gender :</p>
	<label><input type="radio" name="M" ></input>
	Male
	<input type="radio" name="M" ></input>
	Female
	<input type="radio" name="M" ></input>
	Prefer not to Say</label><br><br>
	
	<p>Skills</p>
	<label><input type="checkbox" name="c" ></input>
	HTML
	<input type="checkbox" name="c" ></input>
	css
	<input type="checkbox" name="c" ></input>
	php
	<input type="checkbox" name="c" ></input>
	python</label><br><br><br>
	
	<label>Year of Study</label>
	<select>
		<option>Select Year</option>
		<option>1 Year</option>
		<option>2 Year</option>
		<option>3 Year</option>
		<option>4 Year</option>
	</select><br><br>
	<label>About you :</label><br>
	<textarea rows="4" placeholder="Tell us Bit about Yourself"></textarea><br><br><br>
	
	<button type="Submit" name="submit">Submit</button>
	</form>

</body>
</html>
